<!DOCTYPE html>
<html>

<head>
    <title>Feature Validation Pipeline</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>User Registration Validation</h1>

<input
type="text"
id="name"
placeholder="Enter Name">

<br>

<input
type="email"
id="email"
placeholder="Enter Email">

<br>

<input
type="password"
id="password"
placeholder="Password">

<br>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<br>

<button onclick="validateForm()">
Validate
</button>

<div id="result"></div>

</div>

<script src="script.js"></script>

</body>

</html>
